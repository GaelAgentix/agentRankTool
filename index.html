<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation Candidate Ranking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3864'/%3E%3Crect x='8' y='8' width='16' height='4' rx='2' fill='%23fff'/%3E%3Crect x='8' y='14' width='12' height='4' rx='2' fill='%23D9E2F3'/%3E%3Crect x='8' y='20' width='8' height='4' rx='2' fill='%23D9E2F3'/%3E%3C/svg%3E">
<style>
  /* Layout: one centered column; the ranked list is the page.
     Colors: the navy/blue playbook palette from intake-agent-1's style.py,
     set on a dark ground. */
  :root {
    color-scheme: dark;
    --bg: #0F1626;
    --surface: #172136;
    --panel: #131C2F;
    --field: #0C1220;
    --border: #273552;
    --border-strong: #3A4C73;
    --text: #E7ECF5;
    --text-2: #C2CBDB;
    --muted: #9AA6BE;
    --faint: #5F6E8D;
    --icon: #8494B2;
    --heading: #E3EBFA;
    --accent: #8AACEB;
    --btn-bg: #172136;
    --btn-hover: #1F2C47;
    --primary: #3A63B5;
    --primary-hover: #4874CA;
    --on-primary: #FFFFFF;
    --top-fill: #1A2947;
    --top-border: #2E4572;
    --top-bar: #8AACEB;
    --top-badge: #8AACEB;
    --on-top-badge: #0F1626;
    --badge-bg: #1E2A42;
    --badge-border: #2E3D5E;
    --badge-fg: #C9D6EE;
    --danger: #FF7B7B;
    --danger-soft: #5C2B35;
    --out-bg: #121927;
    --out-border: #212B3F;
    --out-text: #747F96;
    --rule: #26314A;
    --shadow: rgba(0, 0, 0, 0.55);
    --scrim: rgba(5, 9, 18, 0.6);
    --toast-bg: #E7ECF5;
    --toast-fg: #0F1626;
    --font: Arial, Helvetica, sans-serif;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.4;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 72px; }

  /* Header: page name and the two actions */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 20px;
    padding-bottom: 14px;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--border);
  }
  h1 {
    margin: 0;
    color: var(--heading);
    font-size: 1.9rem;
    line-height: 1.2;
    text-wrap: balance;
  }
  .actions-bar { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Buttons */
  button {
    font: 700 0.875rem/1 var(--font);
    color: var(--heading);
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 13px;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); border-color: var(--border-strong); }
  button:focus-visible, .row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

  /* Edit list panel */
  .setup {
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .setup textarea {
    width: 100%;
    min-height: 280px;
    padding: 12px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
    font: 0.95rem/1.5 var(--font);
    resize: vertical;
  }
  .setup textarea::placeholder { color: var(--icon); }
  .setup textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .setup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  /* Rows */
  .list {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .row {
    position: relative;
    display: grid;
    grid-template-columns: auto auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 14px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 6px solid var(--border);
    border-radius: 8px;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .row:hover { border-color: var(--border-strong); }
  .badge {
    display: grid;
    place-items: center;
    width: 2.2rem;
    height: 2.2rem;
    border: 2px solid var(--badge-border);
    border-radius: 50%;
    background: var(--badge-bg);
    color: var(--badge-fg);
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .grip { display: flex; color: var(--faint); touch-action: none; cursor: grab; padding: 4px 0; }
  .text { min-width: 0; }
  .name { color: var(--heading); font-size: 1.1rem; font-weight: 700; overflow-wrap: anywhere; }
  .summary { margin-top: 3px; color: var(--text-2); font-size: 0.95rem; overflow-wrap: anywhere; }
  .editing {
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 3px;
  }

  /* Top three */
  .row.top { background: var(--top-fill); border-color: var(--top-border); border-left-color: var(--top-bar); }
  .row.top .badge { background: var(--top-badge); border-color: var(--top-badge); color: var(--on-top-badge); }

  /* Row action */
  .act {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--icon);
  }
  .act:hover { background: var(--btn-hover); border-color: var(--border); color: var(--danger); }
  .act svg { display: block; }
  .row:not(.out) .restore, .row.out .cross { display: none; }
  .row.out .restore:hover { color: var(--heading); }

  /* Ruled out */
  .out-section { margin-top: 36px; }
  .section-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .section-label::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
  .row.out { cursor: default; background: var(--out-bg); border-color: var(--out-border); border-left-color: var(--out-border); }
  .row.out .badge { background: var(--out-bg); border-color: var(--danger-soft); color: var(--danger); font-size: 0.95rem; }
  .row.out .grip { visibility: hidden; }
  .row.out .name, .row.out .summary {
    color: var(--out-text);
    text-decoration: line-through 1.5px var(--danger);
  }

  /* Drag states */
  .row.lifted {
    position: fixed;
    z-index: 50;
    margin: 0;
    cursor: grabbing;
    box-shadow: 0 16px 36px var(--shadow);
  }
  .placeholder { border: 2px dashed var(--border-strong); border-radius: 8px; background: var(--panel); }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  /* Copy fallback, for browsers that refuse clipboard access */
  .copy-dialog {
    width: min(640px, calc(100vw - 32px));
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
  }
  .copy-dialog::backdrop { background: var(--scrim); }
  .copy-dialog h2 { margin: 0 0 6px; color: var(--heading); font-size: 1.1rem; }
  .copy-dialog p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  .copy-dialog textarea {
    width: 100%;
    height: 240px;
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
    font: 0.85rem/1.5 var(--font);
    resize: vertical;
  }
  .copy-dialog .setup-actions { justify-content: flex-end; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 70;
    padding: 10px 16px;
    border-radius: 8px;
    background: var(--toast-bg);
    color: var(--toast-fg);
    font-size: 0.9rem;
    font-weight: 700;
    transform: translate(-50%, 20px);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 600px) {
    .row { gap: 8px; padding: 12px 6px 12px 8px; }
    .act { width: 34px; height: 34px; }
    h1 { font-size: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Automation Candidate Ranking</h1>
    <div class="actions-bar" id="actionsBar">
      <button id="editBtn" type="button">Edit list</button>
      <button id="copyBtn" class="primary" type="button">Copy results</button>
    </div>
  </header>

  <section id="setup" class="setup" hidden>
    <textarea id="input" spellcheck="true" aria-label="Candidates, one per line: name, a dash, then a short summary" placeholder="Invoice Matching Agent - Matches incoming invoices to purchase orders and flags mismatches.&#10;Customer Inquiry Triage - Reads inbound emails, tags the intent and routes each one to the right team.&#10;Weekly KPI Report Builder - Pulls numbers from source systems and drafts the leadership report."></textarea>
    <div class="setup-actions">
      <button id="saveBtn" class="primary" type="button">Save list</button>
      <button id="cancelBtn" type="button">Cancel</button>
    </div>
  </section>

  <div id="board" hidden>
    <ol id="ranked" class="list" aria-label="Ranked candidates"></ol>
    <section id="outSection" class="out-section" hidden>
      <h2 class="section-label">Ruled out</h2>
      <ul id="outList" class="list" aria-label="Ruled out candidates"></ul>
    </section>
  </div>
</div>

<dialog id="copyDialog" class="copy-dialog" aria-labelledby="copyDialogTitle">
  <h2 id="copyDialogTitle">Copy the results</h2>
  <p>This browser blocked automatic copying. The text below is selected: press Ctrl+C (Cmd+C on a Mac) to copy it.</p>
  <textarea id="copyText" readonly aria-label="Results to copy"></textarea>
  <div class="setup-actions">
    <button id="copyClose" class="primary" type="button">Done</button>
  </div>
</dialog>

<div id="toast" class="toast" role="status"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'agentRankTool:v1';
  const TOP = 3;
  const EXAMPLE = [
    'Invoice Matching Agent - Matches incoming invoices to purchase orders and flags mismatches for review.',
    'Customer Inquiry Triage - Reads inbound emails, tags the intent and routes each one to the right team.',
    'Contract Renewal Tracker - Watches contract end dates and drafts renewal reminders with the key terms.',
    'Meeting Notes Summarizer - Turns call recordings into action items and posts them to the project channel.',
    'Onboarding Paperwork Assistant - Collects new-hire documents and chases anything that is missing.',
    'Weekly KPI Report Builder - Pulls numbers from source systems and drafts the weekly leadership report.',
    'Purchase Request Checker - Checks requests against policy and budget, then routes them for approval.',
    'Policy Answer Bot - Answers internal how-to questions from existing policies and SOPs.',
  ].join('\n');

  const ICONS = {
    grip: '<svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="4" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/><circle cx="3" cy="16" r="1.6"/><circle cx="9" cy="16" r="1.6"/></g></svg>',
    cross: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    restore: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.35-5.65M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  const $ = (sel) => document.querySelector(sel);
  const setup = $('#setup');
  const input = $('#input');
  const board = $('#board');
  const actionsBar = $('#actionsBar');
  const ranked = $('#ranked');
  const outList = $('#outList');
  const outSection = $('#outSection');
  const copyDialog = $('#copyDialog');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = new Map();
  let seq = 0;
  let drag = null;
  let placeholder = null;

  const uid = () => 'c' + Date.now().toString(36) + (seq++).toString(36);

  // ---------------------------------------------------------------- storage

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.items)) return null;
      return {
        items: s.items.filter((i) => i && i.name).map((i) => ({
          id: String(i.id || uid()),
          name: String(i.name),
          summary: String(i.summary || ''),
          out: !!i.out,
        })),
      };
    } catch (e) {
      return null;
    }
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  // ---------------------------------------------------------------- parsing

  // "Name - summary", "Name: summary", "Name | summary", "Name<TAB>summary",
  // "Name — summary". A plain hyphen needs spaces around it so names like
  // "Follow-up Agent" survive.
  const SPLIT = /^(.+?)\s*(?:\t|\s-+\s|[–—]|:\s|\|)\s*(.*)$/;

  function parseLines(text) {
    const parsed = [];
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim()
        .replace(/^\|\s*|\s*\|$/g, '')
        .replace(/^(?:[-*]\s+|[•▪◦]\s*|\d+[.)]\s+|\(\d+\)\s+)/, '')
        .trim();
      if (!line || /^[-|:\s]+$/.test(line)) continue;
      const m = line.match(SPLIT);
      let name = m ? m[1] : line.replace(/\s*[:|–—-]+\s*$/, '');
      let summary = m ? m[2] : '';
      name = name.replace(/\*\*|__/g, '').trim();
      summary = summary.replace(/\*\*|__/g, '').replace(/\s+/g, ' ').trim();
      if (name) parsed.push({ name, summary });
    }
    return parsed;
  }

  const nameKey = (s) => s.toLowerCase().replace(/\s+/g, ' ').trim();

  // The text box order becomes the list order. Lines whose name matches an
  // existing candidate keep its ruled-out state.
  function applyParsed(parsed) {
    const pool = new Map();
    for (const item of state.items) {
      const k = nameKey(item.name);
      if (!pool.has(k)) pool.set(k, []);
      pool.get(k).push(item);
    }
    state.items = parsed.map((p) => {
      const existing = (pool.get(nameKey(p.name)) || []).shift();
      return existing
        ? { ...existing, name: p.name, summary: p.summary }
        : { id: uid(), name: p.name, summary: p.summary, out: false };
    });
  }

  function toText(items) {
    return items.map((i) => (i.summary ? `${i.name} - ${i.summary}` : i.name)).join('\n');
  }

  // First visit opens on a sample list so there is something to try.
  let state = load();
  if (!state) {
    state = { items: [] };
    applyParsed(parseLines(EXAMPLE));
    save();
  }

  // ---------------------------------------------------------------- rendering

  function normalize() {
    state.items = [...state.items.filter((i) => !i.out), ...state.items.filter((i) => i.out)];
  }

  function createRow(item) {
    const li = document.createElement('li');
    li.className = 'row';
    li.dataset.id = item.id;
    li.tabIndex = 0;
    li.innerHTML =
      '<span class="badge"></span>' +
      `<span class="grip" title="Drag to reorder">${ICONS.grip}</span>` +
      '<div class="text"><div class="name"></div><div class="summary"></div></div>' +
      `<button type="button" class="act cross" title="Rule out">${ICONS.cross}</button>` +
      `<button type="button" class="act restore" title="Bring back">${ICONS.restore}</button>`;
    return li;
  }

  function updateRow(li, item) {
    const name = li.querySelector('.name');
    const summary = li.querySelector('.summary');
    if (!name.classList.contains('editing')) name.textContent = item.name;
    if (!summary.classList.contains('editing')) summary.textContent = item.summary;
    summary.hidden = !item.summary;
    li.classList.toggle('out', item.out);
    li.querySelector('.cross').setAttribute('aria-label', `Rule out ${item.name}`);
    li.querySelector('.restore').setAttribute('aria-label', `Bring back ${item.name}`);
  }

  function syncList(parent, wanted) {
    let ref = parent.firstChild;
    for (const el of wanted) {
      if (el === ref) ref = ref.nextSibling;
      else parent.insertBefore(el, ref);
    }
  }

  function render() {
    normalize();
    const focusedId = document.activeElement && document.activeElement.classList.contains('row')
      ? document.activeElement.dataset.id : null;
    const live = new Set(state.items.map((i) => i.id));
    const created = [];

    flip(() => {
      for (const [id, el] of els) {
        if (!live.has(id)) { el.remove(); els.delete(id); }
      }
      const active = [];
      const out = [];
      for (const item of state.items) {
        let el = els.get(item.id);
        if (!el) { el = createRow(item); els.set(item.id, el); created.push(el); }
        updateRow(el, item);
        (item.out ? out : active).push(el);
      }
      syncList(ranked, active);
      syncList(outList, out);
      outSection.hidden = out.length === 0;
      applyRanks();
    });

    if (!reduceMotion) {
      for (const el of created) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
    }
    if (focusedId && els.has(focusedId) && document.activeElement !== els.get(focusedId)) {
      els.get(focusedId).focus({ preventScroll: true });
    }
    board.hidden = !setup.hidden;
    actionsBar.hidden = !setup.hidden;
  }

  // Rank numbers and the top-three highlight follow DOM order, so they
  // update live while a row is being dragged.
  function applyRanks() {
    const kids = [...ranked.children].filter((el) => !drag || el !== drag.row);
    kids.forEach((el, i) => {
      const row = el === placeholder ? drag.row : el;
      row.querySelector('.badge').textContent = i + 1;
      row.classList.toggle('top', i < TOP);
    });
    for (const el of outList.children) {
      el.querySelector('.badge').textContent = '✕';
      el.classList.remove('top');
    }
  }

  // FLIP: measure, change the DOM, then slide each moved row from where it was.
  function flip(change) {
    const before = new Map();
    for (const el of document.querySelectorAll('.list > li')) before.set(el, el.getBoundingClientRect());
    change();
    if (reduceMotion) return;
    for (const [el, r0] of before) {
      if (!el.isConnected || (drag && el === drag.row)) continue;
      const r1 = el.getBoundingClientRect();
      if (Math.abs(r0.top - r1.top) < 0.5 && Math.abs(r0.left - r1.left) < 0.5) continue;
      el.getAnimations().forEach((a) => a.cancel());
      const r2 = el.getBoundingClientRect();
      el.animate(
        [{ transform: `translate(${r0.left - r2.left}px, ${r0.top - r2.top}px)` }, { transform: 'none' }],
        { duration: 220, easing: 'cubic-bezier(.2,.7,.2,1)' },
      );
    }
  }

  // ---------------------------------------------------------------- actions

  const find = (id) => state.items.find((i) => i.id === id);
  const activeItems = () => state.items.filter((i) => !i.out);

  // Ruled-out rows go to the top of the "Ruled out" list; restored rows go to
  // the bottom of the ranking.
  function setOut(id, out) {
    const item = find(id);
    if (!item || item.out === out) return;
    state.items = state.items.filter((i) => i !== item);
    item.out = out;
    state.items.splice(activeItems().length, 0, item);
    save();
    render();
    announce(`${item.name} ${out ? 'ruled out' : 'brought back'}`);
  }

  function move(id, delta) {
    const active = activeItems();
    const from = active.findIndex((i) => i.id === id);
    const to = from + delta;
    if (from < 0 || to < 0 || to >= active.length) return;
    const [item] = active.splice(from, 1);
    active.splice(to, 0, item);
    state.items = [...active, ...state.items.filter((i) => i.out)];
    save();
    render();
    announce(`${item.name} moved to rank ${to + 1}`);
  }

  // ---------------------------------------------------------------- drag and drop

  ranked.addEventListener('pointerdown', (e) => {
    if (drag && !drag.started) endDrag(false); // a release we never saw, e.g. outside the window
    if (drag || e.button !== 0) return;
    const row = e.target.closest('.row');
    if (!row || e.target.closest('button, .editing')) return;
    // On touch screens only the grip starts a drag, so the page still scrolls.
    if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
    drag = { row, id: row.dataset.id, pointerId: e.pointerId, x0: e.clientX, y0: e.clientY, y: e.clientY, started: false };
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragCancel);
  });

  function startDrag() {
    const { row } = drag;
    row.getAnimations().forEach((a) => a.cancel());
    const rect = row.getBoundingClientRect();
    drag.started = true;
    drag.offsetY = drag.y0 - rect.top;
    drag.height = rect.height;
    drag.origNext = row.nextSibling;
    drag.origOrder = activeItems().map((i) => i.id).join();

    placeholder = document.createElement('li');
    placeholder.className = 'placeholder';
    placeholder.style.height = `${rect.height}px`;
    ranked.insertBefore(placeholder, row);

    row.classList.add('lifted');
    row.style.width = `${rect.width}px`;
    row.style.left = `${rect.left}px`;
    row.style.top = `${rect.top}px`;
    try { row.setPointerCapture(drag.pointerId); } catch (err) { /* pointer already released */ }
    document.body.classList.add('dragging');
    applyRanks();
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function onDragMove(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.y = e.clientY;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
      startDrag();
    }
    e.preventDefault();
    drag.row.style.top = `${drag.y - drag.offsetY}px`;
    updateTarget();
  }

  // Uses layout positions (offsetTop) rather than on-screen ones so rows that
  // are still sliding don't make the target flicker.
  function updateTarget() {
    const listTop = ranked.getBoundingClientRect().top;
    const center = drag.y - drag.offsetY + drag.height / 2;
    const others = [...ranked.children].filter((el) => el !== drag.row && el !== placeholder);
    const ref = others.find((el) => listTop + el.offsetTop + el.offsetHeight / 2 > center) || null;
    let current = placeholder.nextSibling;
    if (current === drag.row) current = current.nextSibling;
    if (current === ref) return;
    flip(() => {
      ranked.insertBefore(placeholder, ref);
      applyRanks();
    });
  }

  function autoScroll() {
    if (!drag || !drag.started) return;
    const edge = 80;
    const h = window.innerHeight;
    let v = 0;
    if (drag.y < edge) v = -Math.ceil((edge - drag.y) / 5);
    else if (drag.y > h - edge) v = Math.ceil((drag.y - (h - edge)) / 5);
    if (v) {
      const before = window.scrollY;
      window.scrollBy(0, v);
      if (window.scrollY !== before) updateTarget();
    }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(commit) {
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragCancel);
    const d = drag;
    if (!d || !d.started) { drag = null; return; }
    cancelAnimationFrame(d.raf);

    const from = d.row.getBoundingClientRect();
    ranked.insertBefore(d.row, commit ? placeholder : d.origNext);
    placeholder.remove();
    placeholder = null;
    d.row.classList.remove('lifted');
    d.row.style.width = d.row.style.left = d.row.style.top = '';
    document.body.classList.remove('dragging');
    drag = null;

    const order = [...ranked.children].map((el) => el.dataset.id);
    if (commit && order.join() !== d.origOrder) {
      const byId = new Map(state.items.map((i) => [i.id, i]));
      state.items = [...order.map((id) => byId.get(id)), ...state.items.filter((i) => i.out)];
      save();
      announce(`${byId.get(d.id).name} moved to rank ${order.indexOf(d.id) + 1}`);
    }
    flip(applyRanks);

    if (!reduceMotion) {
      const to = d.row.getBoundingClientRect();
      d.row.animate(
        [{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px)` }, { transform: 'none' }],
        { duration: 180, easing: 'cubic-bezier(.2,.7,.2,1)' },
      );
    }
  }

  const onDragEnd = (e) => { if (drag && e.pointerId === drag.pointerId) endDrag(true); };
  const onDragCancel = (e) => { if (drag && e.pointerId === drag.pointerId) endDrag(false); };

  // ---------------------------------------------------------------- inline editing

  function startEdit(field) {
    const row = field.closest('.row');
    const item = find(row.dataset.id);
    if (!item || field.classList.contains('editing')) return;
    const key = field.classList.contains('name') ? 'name' : 'summary';
    let cancelled = false;
    let viaKey = false;

    try { field.contentEditable = 'plaintext-only'; } catch (e) { field.contentEditable = 'true'; }
    field.classList.add('editing');
    field.focus();
    const range = document.createRange();
    range.selectNodeContents(field);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    const onKey = (e) => {
      e.stopPropagation();
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); viaKey = true; field.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); viaKey = cancelled = true; field.blur(); }
    };
    field.addEventListener('keydown', onKey);
    field.addEventListener('blur', () => {
      field.removeEventListener('keydown', onKey);
      field.contentEditable = 'false';
      field.classList.remove('editing');
      const value = field.textContent.replace(/\s+/g, ' ').trim();
      if (!cancelled && value !== item[key] && (value || key === 'summary')) {
        item[key] = value;
        save();
      }
      render();
      if (viaKey) row.focus({ preventScroll: true });
    }, { once: true });
  }

  // ---------------------------------------------------------------- copy results

  function resultsText() {
    const line = (item) => `${item.name}${item.summary ? ` - ${item.summary}` : ''}`;
    const date = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    const lines = ['Automation candidate ranking', date, ''];
    activeItems().forEach((item, i) => lines.push(`${i + 1}. ${line(item)}`));
    const out = state.items.filter((i) => i.out);
    if (out.length) {
      lines.push('', 'Ruled out:');
      for (const item of out) lines.push(`- ${line(item)}`);
    }
    return lines.join('\n');
  }

  // writeText is called straight from the click so the browser counts it as
  // user-initiated. If the browser refuses, show the text ready to copy by hand.
  function copyResults() {
    const text = resultsText();
    let attempt;
    try {
      attempt = navigator.clipboard.writeText(text);
    } catch (e) {
      attempt = Promise.reject(e);
    }
    attempt.then(() => toast('Ranking copied'), () => {
      const area = $('#copyText');
      area.value = text;
      copyDialog.showModal();
      area.focus();
      area.select();
    });
  }

  // ---------------------------------------------------------------- edit list

  function openSetup() {
    input.value = toText(state.items);
    $('#cancelBtn').hidden = state.items.length === 0;
    setup.hidden = false;
    render();
    input.focus();
  }

  function closeSetup() {
    setup.hidden = true;
    render();
  }

  $('#saveBtn').addEventListener('click', () => {
    const parsed = parseLines(input.value);
    if (!parsed.length) { toast('Add at least one candidate'); input.focus(); return; }
    applyParsed(parsed);
    save();
    closeSetup();
  });
  $('#cancelBtn').addEventListener('click', closeSetup);

  // ---------------------------------------------------------------- wiring

  $('#editBtn').addEventListener('click', openSetup);
  $('#copyBtn').addEventListener('click', copyResults);
  $('#copyClose').addEventListener('click', () => copyDialog.close());

  board.addEventListener('click', (e) => {
    const btn = e.target.closest('.act');
    if (!btn) return;
    const id = btn.closest('.row').dataset.id;
    setOut(id, btn.classList.contains('cross'));
  });

  board.addEventListener('dblclick', (e) => {
    const field = e.target.closest('.name, .summary');
    if (field && !drag) startEdit(field);
  });

  board.addEventListener('keydown', (e) => {
    const row = e.target;
    if (!row.classList || !row.classList.contains('row')) return;
    if (e.ctrlKey || e.metaKey) return;
    const id = row.dataset.id;
    const item = find(id);
    const key = e.key;
    if ((key === 'ArrowUp' || key === 'ArrowDown') && e.altKey) {
      e.preventDefault();
      if (!item.out) move(id, key === 'ArrowUp' ? -1 : 1);
    } else if (key === 'ArrowUp' || key === 'ArrowDown') {
      e.preventDefault();
      const rows = [...board.querySelectorAll('.list > .row')];
      const next = rows[rows.indexOf(row) + (key === 'ArrowUp' ? -1 : 1)];
      if (next) next.focus();
    } else if (key === 'x' || key === 'X') {
      setOut(id, !item.out);
    } else if (key === 'Enter' || key === 'F2') {
      e.preventDefault();
      startEdit(row.querySelector('.name'));
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drag && drag.started) endDrag(false);
  });

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function announce(msg) { $('#sr').textContent = msg; }

  // ---------------------------------------------------------------- start

  if (state.items.length) render();
  else openSetup();
})();
</script>
</body>
</html>
